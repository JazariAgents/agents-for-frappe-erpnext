<style>
/* Layout: the Jazari Agents desk. Sidebar of pill navigation; a greeting, a row of dotted headline
   figures with floating chips and a month strip; then white cards on the brand's pale ground, with
   navy gradient cards carrying the story in white and aqua. Colours and type are the brand's own
   (navy, blue, cyan, aqua; Manrope and IBM Plex Sans Arabic). Light only by design. */
:root {
  color-scheme: light;
  --navy: #06152D; --blue: #087DB9; --cyan: #00B8D9; --aqua: #23E0C5;
  --page: #F7F9FC; --surface: #FFFFFF; --raised: #FFFFFF; --soft: #FFFFFF; --stone: #EEF2F7; --edge: #E5EAF0;
  --ink: #071A3A; --ink-2: #44546B; --muted: #64748B; --grid: #E5EAF0; --axis: #C6D0DC;
  --char: #06152D; --on-char: #FFFFFF; --track: #E3E9F1; --chip: #F1F5FA; --btn: #F1F5FA;
  --feat: radial-gradient(120% 150% at 88% -10%, #0C6B9E 0%, #0A3560 40%, #06152D 100%);
  --pale: linear-gradient(165deg, #E4F7FB 0%, #D6F8F1 100%);
  --s1: #06152D; --s2: #087DB9; --bar: #087DB9;
  --r1: #06152D; --r2: #0A4877; --r3: #087DB9; --r4: #2F97C9; --r5: #5FAFD8; --on-fill: #ffffff; --on-fill-dark: #06152D;
  --good: #0E9F6E; --warning: #D99100; --serious: #EC835A; --critical: #D03B3B; --unknown: #8793A6; --neutral: #8793A6;
  --bad-ink: #B42828; --accent: #087DB9;
  --font: "Manrope", "IBM Plex Sans Arabic", "Inter", "Tajawal", "Segoe UI", system-ui, -apple-system, Roboto, "Noto Sans", "Noto Sans Arabic", sans-serif;
  --dot: "Doto", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
  --r: 26px; --gap: 14px;
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--page); color: var(--ink); font: 400 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--page); }
.wrap { max-width: 1400px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, p { margin: 0; font-weight: 400; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 14px; }
[hidden] { display: none !important; }
.dot { font-family: var(--dot); font-weight: 900; letter-spacing: -.04em; font-variant-numeric: normal; }

/* shell */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 30px; padding-block: 26px 30px; align-items: start; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 26px); display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 600; letter-spacing: -.02em; padding-inline: 2px; line-height: 1.1; color: var(--navy); }
.brand img { width: 44px; height: 44px; flex: none; }
.brand em { font-style: normal; color: var(--cyan); }
.brand svg { width: 24px; height: 24px; flex: none; }
.brand small { font-size: 12px; font-weight: 400; color: var(--muted); letter-spacing: 0; display: block; margin-top: 3px; }
.nav-in { display: flex; flex-direction: column; gap: 8px; }
.tab { display: flex; align-items: center; width: 100%; border: 1px solid var(--edge); background: var(--surface); color: var(--ink); padding: 0; border-radius: 999px; cursor: pointer; text-align: start; white-space: nowrap; font-size: 15px; }
.tab svg { width: 16px; height: 16px; flex: none; }
.tp { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-radius: 999px; }
.tab .go { display: inline-flex; align-items: center; justify-content: center; padding-inline-end: 14px; color: var(--muted); }
[dir="rtl"] .tab .go svg { transform: scaleX(-1); }
.tab:hover { background: var(--stone); }
.tab[aria-selected="true"] { background: none; border-color: transparent; gap: 6px; }
.tab[aria-selected="true"] .tp { background: var(--char); color: var(--on-char); }
.tab[aria-selected="true"] .go { width: 42px; height: 42px; border-radius: 50%; background: var(--aqua); color: var(--navy); padding: 0; flex: none; }
.tab[aria-selected="true"] .go svg { transform: rotate(45deg); }
.sidecard { background: var(--soft); border: 1px solid var(--edge); border-radius: 22px; padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 6px; }
.sidecard b { font-weight: 500; font-size: 16px; }
.sidecard p { color: var(--ink-2); font-size: 13px; }
.chipx { align-self: flex-end; background: var(--aqua); color: var(--navy); border-radius: 999px; padding: 3px 11px; font-size: 12px; }
.content { min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.bar { display: flex; align-items: center; gap: 10px; }
.round { width: 46px; height: 46px; border-radius: 50%; background: var(--soft); border: 1px solid var(--edge); display: grid; place-items: center; flex: none; font-size: 14px; color: var(--ink); }
button.round { cursor: pointer; }
button.round:hover { background: var(--stone); }
.round svg { width: 17px; height: 17px; }
.infopill { background: var(--soft); border: 1px solid var(--edge); border-radius: 999px; padding: 13px 22px; color: var(--muted); flex: 1; max-width: 520px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
.top h1 { font-size: 34px; font-weight: 500; letter-spacing: -.025em; line-height: 1.2; text-wrap: balance; }
.sub { color: var(--ink-2); font-size: 16px; margin-top: 4px; }
.foot { color: var(--muted); font-size: 12px; display: none; }
@media (max-width: 1040px) {

  .side { position: static; gap: 12px; }

  .nav-in::-webkit-scrollbar { display: none; }
  .tab { width: auto; flex: none; }
  .tab .go { display: none; }
  .tab[aria-selected="true"] { background: var(--char); }
  .sidecard { display: none; }
  .foot { display: block; }
  .top h1 { font-size: 28px; }
  .infopill { max-width: none; }
}

/* grid and cards */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); }
.c12 { grid-column: span 12; } .c8 { grid-column: span 8; } .c7 { grid-column: span 7; } .c6 { grid-column: span 6; } .c5 { grid-column: span 5; } .c4 { grid-column: span 4; }
@media (max-width: 1180px) { .c8, .c4 { grid-column: span 12; } }
@media (max-width: 900px) { .c7, .c6, .c5 { grid-column: span 12; } }
.card { background: var(--surface); border: 1px solid var(--edge); border-radius: var(--r); padding: 22px 24px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.card.feature { background: var(--feat); border-color: transparent; color: #fff; --ink: #ffffff; --ink-2: rgba(255,255,255,.88); --muted: rgba(255,255,255,.74); --s1: #ffffff; --s2: #23E0C5; --grid: rgba(255,255,255,.12); --axis: rgba(255,255,255,.3); --surface: #0A3560; --chip: rgba(255,255,255,.1); --track: rgba(255,255,255,.16); --char: #23E0C5; --on-char: #06152D; --bar: #23E0C5; --btn: rgba(255,255,255,.1); }
.card.pale { background: var(--pale); border-color: transparent; --chip: rgba(255,255,255,.7); --track: rgba(6,21,45,.12); }
.card.center { align-items: center; text-align: center; justify-content: space-between; }
.card-body { display: flex; flex-direction: column; gap: 16px; min-width: 0; flex: 1; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.card h2 { font-size: 19px; font-weight: 500; letter-spacing: -.015em; line-height: 1.25; text-wrap: balance; }
.card-head p { color: var(--ink-2); font-size: 14px; margin-top: 3px; }
.mini { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--btn); display: grid; place-items: center; cursor: pointer; flex: none; color: var(--ink); }
.mini svg { width: 16px; height: 16px; }
.mini:hover { background: var(--chip); }
.mini[aria-pressed="true"] { background: var(--char); color: var(--on-char); }
.src { color: var(--muted); font-size: 11.5px; margin-top: auto; padding-top: 2px; }
.na { color: var(--ink-2); font-size: 13px; padding: 14px 16px; border-radius: 16px; background: var(--chip); }
.na b { display: block; color: var(--ink); font-weight: 500; margin-bottom: 2px; }

/* headline figures: dotted numerals, a thin unit beside them, a chip floating above */
.lead { display: flex; flex-direction: column; gap: 26px; justify-content: space-between; padding-block: 4px; min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px 26px; }

.kpi { position: relative; padding-top: 30px; min-width: 0; }
.chipf { position: absolute; top: 0; inset-inline-start: 0; background: var(--raised); border: 1px solid var(--edge); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; white-space: nowrap; }
.chipf.dark { background: var(--navy); color: #fff; border-color: transparent; }
.lbl { color: var(--muted); font-size: 15px; }
.val { display: flex; align-items: baseline; gap: 6px; flex-wrap: nowrap; font-size: 34px; line-height: 1.05; margin-top: 4px; white-space: nowrap; }
.val.big { font-size: clamp(30px, 2.7vw, 44px); }
.kpi { padding-top: 34px; }
.dot .sep { font-family: var(--font); font-weight: 600; letter-spacing: 0; margin-inline: .03em; }
.val .unit { font-family: var(--font); font-size: .46em; font-weight: 300; color: var(--muted); letter-spacing: 0; }
.kpi .lbl { margin-top: 6px; }
.note { color: var(--ink-2); font-size: 13px; margin-top: 7px; }
.note.bad { display: inline-flex; align-items: center; min-height: 22px; background: var(--char); color: var(--on-char); border-radius: 999px; padding: 1px 11px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px 26px; align-items: start; }
.mstrip { display: flex; align-items: center; gap: 7px; min-height: 66px; }
.mstrip i { flex: 1; border-radius: 11px; background: var(--blue); min-width: 6px; }
.mstrip .now { flex: 3.4; min-width: 150px; position: relative; background: linear-gradient(120deg, #087DB9 0%, #00B8D9 100%); color: #fff; border-radius: 18px; padding: 10px 18px 11px; display: flex; flex-direction: column; justify-content: center; }
.mstrip .now b { font-weight: 400; font-size: 19px; line-height: 1.15; }
.mstrip .now small { font-size: 12.5px; opacity: .92; }
.mstrip .when { position: absolute; top: -13px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; border-radius: 999px; padding: 3px 12px; font-size: 12px; white-space: nowrap; }
.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); }
.orb { width: 58px; height: 58px; border-radius: 50%; margin-block: 6px; background: radial-gradient(circle at 36% 30%, #ffffff 0%, #EAFBFA 34%, #8DEBE0 66%, #23E0C5 100%); box-shadow: 0 0 30px 9px rgba(35,224,197,.5), inset -3px -4px 8px rgba(0,150,170,.25); }
.say { font-size: 15px; line-height: 1.45; text-align: start; }
.score { font-size: 68px; line-height: .95; }
.of { color: var(--muted); font-size: 20px; font-weight: 300; border-top: 1px solid var(--axis); padding-top: 8px; width: 62%; }
.glass { display: flex; gap: 8px; flex-wrap: wrap; }
.glass > div { background: var(--chip); border-radius: 13px; padding: 8px 13px; min-width: 86px; }
.glass small { display: block; color: var(--ink-2); font-size: 12px; }
.rings { display: grid; grid-template-columns: repeat(auto-fit, minmax(108px, 1fr)); gap: 18px 12px; }
.ringbox { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.ring { width: 92px; height: 92px; flex: none; }
.ring text { fill: var(--ink); }

.ring text.pc { font: 300 12px var(--font); fill: var(--muted); }
.rl { font-size: 14px; }
.ringrow { display: flex; align-items: center; gap: 14px; }
.ringrow .ring { width: 76px; height: 76px; }

/* chips and lists */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; background: var(--chip); border-radius: 999px; padding: 4px 12px 4px 9px; justify-self: start; color: var(--ink); }
.card.feature .pill { color: #fff; }

.list { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 108px minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--grid); }

.row .what { min-width: 0; overflow-wrap: anywhere; font-size: 15px; }

@media (max-width: 520px) { .row { grid-template-columns: minmax(0, 1fr) auto; } .row .pill { grid-column: 1 / -1; } .row .det { grid-column: 1 / -1; } }

.bars { display: grid; grid-template-columns: minmax(90px, 34%) minmax(0, 1fr) auto; gap: 12px 14px; align-items: center; }
.bars .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars .trk { height: 9px; background: var(--track); border-radius: 999px; }
.bars .bar { height: 9px; background: var(--bar); border-radius: 999px; min-width: 4px; }

.seg > div.dark-label { color: var(--on-fill-dark); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 4px; margin-inline-end: 6px; vertical-align: -1px; }
.legend i.line { height: 2px; width: 16px; border-radius: 1px; vertical-align: 3px; }

.legend b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }

.plot svg { display: block; width: 100%; overflow: visible; }

.plot text.end { fill: var(--ink); font-size: 12.5px; }
.tip { position: absolute; top: 0; z-index: 3; pointer-events: none; background: #ffffff; --muted: #64748B; color: #071A3A; border: 1px solid #E5EAF0; border-radius: 14px; padding: 9px 13px; box-shadow: 0 8px 26px rgba(0,0,0,.14); font-size: 13px; min-width: 124px; text-align: start; }
.tip .th { color: var(--muted); margin-bottom: 4px; }
.tip .tr { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.tip .tr span { color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.tip .tr span i { width: 12px; height: 2px; border-radius: 1px; display: inline-block; background: #087DB9 !important; }
.tip .tr b { font-variant-numeric: tabular-nums; font-weight: 500; }

/* tables */
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: start; padding-block: 10px; padding-inline: 0 16px; border-top: 1px solid var(--grid); vertical-align: baseline; font-weight: 400; }
tr > :last-child { padding-inline-end: 0; }
thead th { border-top: 0; color: var(--muted); font-size: 13px; white-space: nowrap; padding-top: 0; }
td.n, th.n { text-align: end; font-variant-numeric: tabular-nums; }
td.id { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
td b { font-weight: 500; }
.empty { max-width: 560px; margin: 12vh auto; text-align: center; }
.empty h1 { font-size: 30px; margin-bottom: 8px; }
@media (max-width: 520px) { .val.big { font-size: 38px; } .card { padding: 18px; border-radius: 20px; } .duo { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: no-preference) { .round, .tab, .tp, .mini { transition: background-color .14s, color .14s; } }
</style>

  /* what the plugin's own agents did, from the workspace activity log: self-reported, and labelled so */
  agents() {

    if (g.by_day) out.push(card({ span: 'c5', title: t('agPerDay'), sub: t('agPerDaySub'),
      draw: el => columnChart(el, { title: t('agPerDay'), height: 210, labels: g.by_day.days.map(dayShort), series: [{ name: t('reqs'), color: 'var(--s1)', values: g.by_day.counts }], fmt: int }),
      table: { head: [t('day'), t('reqs')], rows: g.by_day.days.map((d, i) => [dayShort(d), int(g.by_day.counts[i])]), num: [1] } }));
    const LV = { done: 'good', partial: 'warning', failed: 'serious', refused: 'neutral' }, LB = { done: 'oDone', partial: 'oPartial', failed: 'oFailed', refused: 'oRefused' };
    out.push(card({ span: 'c7', title: t('agRecent'), body: (g.recent || []).length ? h('div', { class: 'tw' }, table(
      [t('when'), t('agent'), t('task'), t('outcome'), t('colChanged')],

    if ((g.by_adapter || []).length) out.push(card({ span: 'c5', title: t('agVia'), body: bars(g.by_adapter.map(a => ({ name: a.name, value: a.count })), int) }));
    return out;
  }
};
